<title>Venue Scorer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: scouting sheet. Inputs on the left, verdict and factor breakdown on the right, league yardstick strip below. */
:root{
  --bg:#f3f5f7; --panel:#ffffff; --ink:#14233a; --muted:#5b6b80; --line:#d9e0e8;
  --court:#1f5fa8; --ball:#c9d83a; --ball-ink:#3d4a00;
  --good:#1e8a55; --mid:#b07b12; --bad:#b4442f; --dot:#9fb0c4;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Public Sans",ui-sans-serif,system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1722; --panel:#16212f; --ink:#e6edf5; --muted:#93a3b8; --line:#273548;
  --court:#6fa8ec; --ball:#d6e45a; --ball-ink:#20280a; --good:#4cc488; --mid:#e0ab42; --bad:#ef7a63; --dot:#4b5c72; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1722; --panel:#16212f; --ink:#e6edf5; --muted:#93a3b8; --line:#273548;
  --court:#6fa8ec; --ball:#d6e45a; --ball-ink:#20280a; --good:#4cc488; --mid:#e0ab42; --bad:#ef7a63; --dot:#4b5c72; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:1120px;margin:0 auto;padding-block:28px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:minmax(0,1fr);gap:22px}
header h1{font-family:var(--display);font-weight:800;font-size:clamp(28px,4vw,40px);line-height:1.05;margin:0;text-wrap:balance;letter-spacing:-.01em}
header p{margin:6px 0 0;color:var(--muted);max-width:68ch}
.eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--court)}
.grid{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:820px){.grid{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px}
form{display:grid;gap:14px}
label{display:grid;gap:5px;font-weight:600;font-size:13px}
label small{font-weight:400;color:var(--muted)}
input,select{font:inherit;font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:9px 11px;width:100%;box-sizing:border-box}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--court);outline-offset:2px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
button{font:inherit;font-weight:600;cursor:pointer;border-radius:7px;padding:10px 14px;border:1px solid var(--court);background:var(--court);color:var(--panel)}
.err{color:var(--bad);font-size:13.5px;margin:0}
.verdict{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:center}
.big{font-family:var(--display);font-weight:800;font-size:72px;line-height:.9;font-variant-numeric:tabular-nums}
.big span{font-size:22px;color:var(--muted);font-weight:600}
.pill{display:inline-block;font-family:var(--mono);font-size:12px;letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;border-radius:999px;border:1px solid currentColor}
.site{font-family:var(--display);font-weight:600;font-size:20px;margin:0 0 4px}
.verdict p{margin:6px 0 0;color:var(--muted)}
.tbl{overflow-x:auto;margin-top:18px}
table{border-collapse:collapse;width:100%;min-width:560px;font-variant-numeric:tabular-nums}
th{font-family:var(--mono);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:500;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
td.num{text-align:right;font-family:var(--mono);font-size:13.5px}
td .d{color:var(--muted);font-size:13px}
.bar{height:6px;background:var(--line);border-radius:3px;min-width:70px;margin-top:6px}
.bar i{display:block;height:100%;border-radius:3px;background:var(--court)}
tfoot td{font-weight:600;border-bottom:0}
.checks{margin:16px 0 0;padding:0;list-style:none;display:grid;gap:6px;font-size:14px}
.checks li{padding-left:18px;position:relative}
.checks li::before{content:"";position:absolute;left:2px;top:8px;width:8px;height:8px;border-radius:50%;background:var(--ball);box-shadow:0 0 0 1px var(--ball-ink)}
h2{font-family:var(--display);font-weight:600;font-size:20px;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 12px;font-size:14px;max-width:72ch}
svg text{fill:var(--muted);font-family:var(--mono);font-size:11px}
.bands{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}
@media (max-width:620px){.bands{grid-template-columns:repeat(2,minmax(0,1fr))}}
.band{border:1px solid var(--line);border-radius:8px;padding:10px;font-size:13px}
.band b{display:block;font-family:var(--mono);font-size:12px;color:var(--muted);font-weight:500}
.band strong{font-family:var(--display);font-size:22px}
.band.on{border-color:var(--court);box-shadow:inset 0 0 0 1px var(--court)}
.notes{font-size:13.5px;color:var(--muted);display:grid;gap:6px;max-width:80ch}
.notes p{margin:0}
.ex{display:flex;flex-wrap:wrap;gap:6px;font-size:13px;color:var(--muted);align-items:center}
.ex button{background:transparent;color:var(--court);padding:4px 9px;font-weight:500;font-size:13px}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .35s ease}}
.prow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:620px){.prow{grid-template-columns:1fr 1fr}}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:6px}
.kpi{background:var(--panel);padding:12px 14px;display:grid;gap:2px}
.kpi b{font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums}
.kpi span{font-size:12.5px;color:var(--muted)}
.kpi.hero b{color:var(--court);font-size:30px}
.math{font-family:var(--mono);font-size:12.5px;color:var(--muted);margin:10px 0 0;line-height:1.7;overflow-wrap:anywhere}
.two{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:820px){.two{grid-template-columns:minmax(0,1fr)}}
@media (max-width:620px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
